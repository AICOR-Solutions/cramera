[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-questions"
version = "1.0.0"
description = "A cramera viewer plugin asking recorded scenes questions in the entity query language, answered by cramera-bridge."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
dependencies = ["cramera==1.0.0", "cramera-protocol==1.0.0", "typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
# Answering questions needs cramera-bridge's question engine and krrood, which comes from
# the CRAM workspace and is not installable from an index.
cram = ["cramera-bridge==1.0.0"]

[project.entry-points."cramera.plugins"]
questions = "cramera_questions.plugin:QuestionsPlugin"

[project.urls]
Source = "https://github.com/AICOR-Solutions/cramera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramera_questions = ["web/**/*"]
