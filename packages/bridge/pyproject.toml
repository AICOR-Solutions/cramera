[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-bridge"
version = "1.0.0"
description = "Publish a running CRAM world to the cramera viewer, record runs into scene bundles, onboard demos, answer questions in the entity query language and perform plan builder plans."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
# The CRAM packages (coraplex, cramph, semantic_digital_twin, giskardpy, krrood) come from the
# CRAM workspace and are not installable from an index, so they are not listed here.
dependencies = [
    "cramera==1.0.0",
    "cramera-protocol==1.0.0",
    "numpy",
    "scipy",
    "psutil",
    "sqlalchemy>=2.0",
    "typing_extensions>=4.8",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
cramera-live = "cramera_bridge.command_line:live"
cramera-onboard = "cramera_bridge.command_line:onboard"
cramera-preflight = "cramera_bridge.real_robot:main"
cramera-record-answers = "cramera_bridge.questions.answer_recording:main"
cramera-record-classes = "cramera_bridge.scenes.bundle_classes:main"

# The "cram" namespace of cramera's identifier registry (cramera_protocol.registry): CRAM's
# robots and actions that plans name, declared here because the bridge is the package that
# loads CRAM's classes. The registry reads these entries as metadata and never loads them.
# Aliases keep the class names plans saved before the protocol named its classes.
[project.entry-points."cramera.namespaces"]
cram = "coraplex"

[project.entry-points."cramera.robots"]
armar7 = "semantic_digital_twin.robots.armar7:Armar7"
daisy = "semantic_digital_twin.robots.daisy:DAiSy"
garmi = "semantic_digital_twin.robots.garmi:Garmi"
hsrb = "semantic_digital_twin.robots.hsrb:HSRB"
icub3 = "semantic_digital_twin.robots.icub3:ICub3"
justin = "semantic_digital_twin.robots.justin:Justin"
mmp_dresden = "semantic_digital_twin.robots.mmp_dresden:MMPDresden"
pr2 = "semantic_digital_twin.robots.pr2:PR2"
stretch = "semantic_digital_twin.robots.stretch:Stretch"
tiago = "semantic_digital_twin.robots.tiago:Tiago"
tiago_mujoco = "semantic_digital_twin.robots.tiago:TiagoMujoco"
tracy = "semantic_digital_twin.robots.tracy:Tracy"
unitree_g1 = "semantic_digital_twin.robots.unitree_g1:UnitreeG1"

[project.entry-points."cramera.actions"]
close = "coraplex.robot_plans.actions.core.container:CloseAction"
container = "coraplex.robot_plans.actions.core.container:MovesContainerByItsHandle"
detect = "coraplex.robot_plans.actions.core.misc:DetectAction"
elevator_navigation = "coraplex.robot_plans.actions.core.navigation:ElevatorNavigation"
face_at = "coraplex.robot_plans.actions.core.navigation:FaceAtAction"
follow_tool_center_point_path = "coraplex.robot_plans.actions.core.robot_body:FollowToolCenterPointPathAction"
grasping = "coraplex.robot_plans.actions.core.pick_up:GraspingAction"
look_at = "coraplex.robot_plans.actions.core.navigation:LookAtAction"
move_manipulator = "coraplex.robot_plans.actions.core.robot_body:MoveManipulatorAction"
move_to_reach = "coraplex.robot_plans.actions.core.misc:MoveToReach"
move_fingers_to_width = "coraplex.robot_plans.actions.core.robot_body:MoveFingersToWidthAction"
move_torso = "coraplex.robot_plans.actions.core.robot_body:MoveTorsoAction"
navigate = "coraplex.robot_plans.actions.core.navigation:NavigateAction"
open = "coraplex.robot_plans.actions.core.container:OpenAction"
park_arms = "coraplex.robot_plans.actions.core.robot_body:ParkArmsAction"
path_planning_navigate = "coraplex.robot_plans.actions.core.navigation:PathPlanningNavigateAction"
pick_up = "coraplex.robot_plans.actions.core.pick_up:PickUpAction"
place = "coraplex.robot_plans.actions.core.placing:PlaceAction"
reach = "coraplex.robot_plans.actions.core.pick_up:ReachAction"
set_gripper = "coraplex.robot_plans.actions.core.robot_body:SetGripperAction"
carry = "coraplex.robot_plans.actions.composite.carrying:CarryAction"
cutting = "coraplex.robot_plans.actions.composite.tool_based:CuttingAction"
face_and_look_at = "coraplex.robot_plans.actions.composite.facing:FaceAndLookAtAction"
mixing = "coraplex.robot_plans.actions.composite.tool_based:MixingAction"
move_and_open = "coraplex.robot_plans.actions.composite.transporting:MoveAndOpenAction"
move_and_pick_up = "coraplex.robot_plans.actions.composite.transporting:MoveAndPickUpAction"
move_and_place = "coraplex.robot_plans.actions.composite.transporting:MoveAndPlaceAction"
look_at_and_detect = "coraplex.robot_plans.actions.composite.searching:LookAtAndDetectAction"
pick_and_place = "coraplex.robot_plans.actions.composite.transporting:PickAndPlaceAction"
pouring = "coraplex.robot_plans.actions.composite.tool_based:PouringAction"
search = "coraplex.robot_plans.actions.composite.searching:SearchAction"
transport = "coraplex.robot_plans.actions.composite.transporting:TransportAction"
wiping = "coraplex.robot_plans.actions.composite.tool_based:WipingAction"

[project.entry-points."cramera.action_fields"]
