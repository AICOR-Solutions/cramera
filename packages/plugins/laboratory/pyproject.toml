[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-laboratory"
version = "1.0.0"
description = "The compact AICOR medical laboratory in the cramera viewer, with optional MuJoCo physics and a PR2 transfer through cramera-bridge."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
# The CRAM packages (coraplex, semantic_digital_twin, giskardpy) come from the CRAM
# workspace and are not installable from an index; only the world and the task demo
# need them, through cramera-bridge (the "bridge" extra).
dependencies = [
    "cramera==1.0.0",
    "cramera-protocol==1.0.0",
    "numpy",
    "scipy",
    "typing_extensions>=4.8",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
physics = ["mujoco>=3.2"]
bridge = ["cramera-bridge==1.0.0"]

[project.scripts]
cramera-laboratory-transfer = "cramera_laboratory.transfer:main"

[project.entry-points."cramera.plugins"]
laboratory = "cramera_laboratory.plugin:LaboratoryPlugin"

[project.urls]
Source = "https://github.com/AICOR-Solutions/cramera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramera_laboratory = ["web/**/*", "resources/**/*"]

[tool.setuptools.exclude-package-data]
cramera_laboratory = ["resources/**/*.blend"]
