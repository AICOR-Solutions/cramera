[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-workshop"
version = "1.0.0"
description = "A cramera viewer plugin for the AICOR woodworking workshop: a MuJoCo contact world with an ideal screw thread, and recorded PR2 screw pickup, insertion and assembly demos."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
dependencies = ["cramera==1.0.0", "cramera-protocol==1.0.0", "typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
# The contact world; the robot demos also need cramera-cram and the CRAM workspace.
physics = ["mujoco>=3.2", "numpy", "scipy"]

[project.entry-points."cramera.plugins"]
workshop = "cramera_workshop.plugin:WorkshopPlugin"

[project.scripts]
cramera-workshop = "cramera_workshop.command_line:main"

[project.urls]
Source = "https://github.com/sunava/cramera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramera_workshop = ["web/**/*", "resources/**/*"]
