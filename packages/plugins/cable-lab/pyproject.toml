[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-cable-lab"
version = "1.0.0"
description = "A cramera viewer plugin that simulates a MuJoCo composite cable with semantic point references and a force-limited friction gripper."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
# The simulation also needs the CRAM workspace (semantic_digital_twin and
# physics_simulators), which is not installable from an index.
dependencies = ["cramera==1.0.0", "cramera-protocol==1.0.0", "typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
physics = ["mujoco>=3.2", "numpy", "scipy"]

[project.entry-points."cramera.plugins"]
cable-lab = "cramera_cable_lab.plugin:CableLabPlugin"

[project.urls]
Source = "https://github.com/AICOR-Solutions/cramera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramera_cable_lab = ["web/**/*"]
