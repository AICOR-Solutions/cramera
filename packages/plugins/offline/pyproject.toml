[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-offline"
version = "1.0.0"
description = "Present recorded CRAM runs as a storyboard without a robot or a network, and check that scene bundles hold every file they reference."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
dependencies = ["cramera==1.0.0", "cramera-protocol==1.0.0", "typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.entry-points."cramera.plugins"]
offline = "cramera_offline.plugin:OfflinePlugin"

[project.scripts]
cramera-check-bundle = "cramera_offline.check_command:main"
cramera-offline = "cramera_offline.presentation_command:main"

[project.urls]
Source = "https://github.com/AICOR-Solutions/cramera"

[tool.setuptools.packages.find]
where = ["src"]
