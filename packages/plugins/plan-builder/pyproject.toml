[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-plan-builder"
version = "1.0.0"
description = "A cramera viewer plugin that composes robot plans by drag and drop, places their objects and targets, attaches constraints in plain language and runs the generated demo."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
dependencies = ["cramera==1.0.0", "cramera-protocol==1.0.0", "typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
# The catalog's robots and objects and the generated demos need the CRAM workspace,
# which is not installed from an index.
cram = ["cramera-cram==1.0.0"]

[project.entry-points."cramera.plugins"]
plan-builder = "cramera_plan_builder.plugin:PlanBuilderPlugin"

[project.urls]
Source = "https://github.com/AICOR-Solutions/cramera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramera_plan_builder = ["web/**/*", "rules/*.json", "templates/*.py"]
