[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-scene-builder"
version = "1.0.0"
description = "A cramera viewer plugin that arranges copies of existing models, robots and scanned rooms into editable scene drafts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
dependencies = ["cramera==1.0.0", "cramera-protocol==1.0.0", "typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.entry-points."cramera.plugins"]
scene-builder = "cramera_scene_builder.plugin:SceneBuilderPlugin"

[project.urls]
Source = "https://github.com/AICOR-Solutions/cramera"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramera_scene_builder = ["web/**/*"]
