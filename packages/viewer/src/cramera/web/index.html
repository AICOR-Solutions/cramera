<!doctype html>
<html lang="en" data-viewer-state="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cramera</title>
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/viewer.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/",
        "three/examples/jsm/": "./vendor/three/examples/jsm/",
        "urdf-loader": "./vendor/urdf-loader/src/URDFLoader.js"
      }
    }
  </script>
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="cramera home">
      <img src="images/icon.svg" alt="" width="22" height="22">
      <span>cramera</span>
    </a>
    <nav class="scene-picker" id="scene-picker" aria-label="Scene"></nav>
    <span class="version" id="viewer-version"></span>
  </header>

  <main class="workspace">
    <section class="stage" id="stage" aria-label="3D scene">
      <div class="stage-message" id="stage-message" hidden></div>
    </section>
    <aside class="side" id="side-panels" aria-label="Panels"></aside>
  </main>

  <footer class="timeline" id="timeline" aria-label="Playback"></footer>
  <p class="status-line" id="status-line" role="status" aria-live="polite">Loading…</p>
</body>
</html>
