[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera-protocol"
version = "1.0.0"
description = "The formats and messages cramera's packages exchange: scene bundles, the scenes index, live messages and routes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vanessa Hassouna" }]
dependencies = ["typing_extensions>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Source = "https://github.com/sunava/cramera"

[tool.setuptools.packages.find]
where = ["src"]
