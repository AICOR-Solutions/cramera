# Publishes https://sunava.github.io/cramera/ from every push to main: the viewer with
# the demo scenes under demo/scenes, and a status page that shows the version, the
# commit, the build time and a screenshot of the viewer taken in this build. A build
# whose viewer does not show its scene fails, so the site keeps the last working build.
name: Publish the demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DEFAULT_SCENE: pr2_warehouse_transport

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the viewer
        run: pip install ./packages/protocol ./packages/viewer

      - name: Export the site with the demo scenes
        run: >
          cramera-export-site site
          --scenes demo/scenes
          --default-scene "$DEFAULT_SCENE"
          --commit "$GITHUB_SHA"
          --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Take the screenshot the status page shows
        run: |
          mkdir -p site/status
          python -m http.server 8000 --bind 127.0.0.1 &
          export PATH="$CHROMEWEBDRIVER:$PATH"
          cramera-shot "http://127.0.0.1:8000/site/" site/status/viewer.png \
            --browser chrome --timeout 180 --report site/status/viewer.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
