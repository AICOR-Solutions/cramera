# Runs the browser-side tests of the viewer. They need only Node.js: the Python
# tests still live in the CRAM fork under test/cramera_test, because they import
# the CRAM workspace packages.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the browser-side tests
        run: node --test test/js/*.js
